#
# example.yml - a YAML config for CI test fixture
#
# The test fixture consists of a number of carriers, each with one or more
# UUTs.  This file defines the structure, and provides an example for testing.
#
# The actual YAML used by gitlab CI should be defined in gitlab at:
#   meta-iveia -> Settings -> CI/CD -> Variables -> TEST_FIXTURE_YAML
# The type should be "file", and it gets passed as a YAML file to
# scripts/ci/citest
#


# Config section is currently empty.  Reserved for future use.
config:
    # Test protocol used by ATP
    protocol: CITEST

    # TFTP server.  Optional - use if different than default
    serverip: 192.168.10.1

    # UUT map.  Some UUTs may need to run from a different dir than their PN.
    # This maps UUT PNs, which are used as the TFTP boot dir, to a different
    # dir.
    uut_map:
        00172: 00172-fs001

# List of carriers
carriers:
    - 
      # PN of a supported carrier for testing (00118, 00176, or others)
      # [initially only 118 supported]
      sn: DH123

      # IP addr of carrier.  Address must be accessible from TSC.
      ip: 192.168.10.214

      # List of UUT 5 digit SNs.  Must be EMPTY if physical slot on carrier is
      # empty.  Num UUTs should correspond to the physical slots for the given
      # carrier PN.
      uuts: [EMPTY, CJABC, CZ123, EMPTY]

    - sn: CEAHT
      ip: 192.168.10.215
      uuts: [CAXYZ]
