#
# Gitlab CI - build/test/release/deploy ivinstall
# 
stages:
  - build-docker
  - build
  - install
  - test
  - release
  - deploy

workflow:
  rules:
    # Don't run pipeline on push, user must initiate it, unless tagged release
    - if: $CI_PIPELINE_SOURCE != "push"
    - if: $CI_COMMIT_TAG    

variables:
  IVTEST_REL_PATH: out/ivtest
  IVINSTALL_REL_PATH: out/ivinstall
  IVINSTALL_ABS_PATH: ${CI_PROJECT_DIR}/${IVINSTALL_REL_PATH}
  IVINSTALL_TGT: ivinstall-full
  UBUNTU_VER: "18.04"

  # MACHINEs that will be built and installed on the TFTP server
  MACHINES: >-
    00049
    00068
    00090
    00102
    00104
    00108
    00114
    00122
    00126
    00127
    00130

.build-docker-script: &build-docker-script
  stage: build-docker
  script:
    - >
      docker build
      -t ubuntu-yocto:$UBUNTU_VER
      -f ./scripts/docker/Dockerfile.ubuntu-yocto-$UBUNTU_VER .

build-docker-stan:
  tags: [stan]
  <<: *build-docker-script

build-docker-joe:
  tags: [joe]
  <<: *build-docker-script

build-job:
  stage: build
  tags: [docker]
  image: ubuntu-yocto:$UBUNTU_VER
  variables:
    # Need unshallow clone so that `git describe` works for versioning
    GIT_STRATEGY: clone
    GIT_DEPTH: 0

    # Yocto caching: gitlab need to know these to cache between pipeline runs.
    # The vars are passed to make, so make can pass them to the Yocto build.
    # ONLY downloads are cached - caching the sstate-cache can cause build
    # issues.
    DL_DIR: cache/downloads

    SDKS: >-
      atlas-z7
      atlas-z8

    # These targets need to be rebuilt (if cached) in order to build in the
    # latest version stamp
    CLEAN_TGTS: fsbl-firmware u-boot-xlnx linux-xlnx xilinx-bootbin ${IVINSTALL_TGT}

    SS: source setupsdk
    IMGDIR: build/tmp/deploy/images
  timeout: 10h
  cache:
    paths:
      - $DL_DIR
  script:
    # Save CI_JOB_URL
    - echo BUILD_JOB_URL=$CI_JOB_URL > vars.env
    
    - cat /etc/lsb-release

    - ./download DONTMOVELAYER
    - cd meta-iveia-project

    - echo "DL_DIR = \"${CI_PROJECT_DIR}/${DL_DIR}\"" >> build/conf/local.conf
    - mkdir -p ${IVINSTALL_ABS_PATH}

    # Build MACHINE ivinstalls.
    - > # NOTE: YAML FOLDING REQUIRES ALIGNED INDENT BELOW
      for m in $MACHINES; do 
      ($SS && MACHINE=$m bitbake ${IVINSTALL_TGT}) || exit 1;
      pwd;
      cp -v $IMGDIR/$m/${IVINSTALL_TGT}-$m ${IVINSTALL_ABS_PATH} || exit 1;
      done

    # Build SDKs.
    - > # NOTE: YAML FOLDING REQUIRES ALIGNED INDENT BELOW
      for s in $SDKS; do
      ($SS && MACHINE=$s bitbake iveia-image-minimal -c populate_sdk) || exit 1;
      pwd;
      IMG_PREFIX=build/tmp/deploy/sdk/petalinux-glibc-x86_64-iveia-image-minimal;
      cp -v ${IMG_PREFIX}-*-${s}-toolchain-*.sh ${IVINSTALL_ABS_PATH} || exit 1;
      done
    - ls -la ${IVINSTALL_ABS_PATH}

  artifacts:
    paths:
      - ${IVINSTALL_REL_PATH}
    reports:
      dotenv: vars.env

install-job:
  stage: install
  tags: [ivtest]
  variables:
    TFTP_DIR: /srv/tftp
  script:
    - cp ${CI_PROJECT_DIR}/recipes-core/images/files/uEnv.cishim.txt ${TFTP_DIR}/uEnv.txt
    # Optionally override default TFTP serverip by appending to uEnv.txt

    - cd ${TFTP_DIR}
    - > # NOTE: YAML FOLDING REQUIRES ALIGNED INDENT BELOW
      for m in $MACHINES; do
      rm -rf ${m} || exit 1;
      mkdir ${m} || exit 1;
      ${IVINSTALL_ABS_PATH}/ivinstall-full-${m} -d ${m} || exit 1;
      done

test-job:
  stage: test
  tags: [ivtest]
  script:
    # Save CI_JOB_URL
    - echo TEST_JOB_URL=$CI_JOB_URL > vars.env

    - bash scripts/ci/citest "$TEST_FIXTURE_YAML"

  artifacts:
    when: always
    paths:
      - ${IVTEST_REL_PATH}
    reports:
      dotenv: vars.env

release-job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags: [docker]
  rules:
    - if: $CI_COMMIT_TAG    
  script:
    - echo 'Running release-job'
  release:
    tag_name: $CI_COMMIT_TAG
    description: ${IVTEST_REL_PATH}/shortsummary.md
    assets:
       links:
         - name: 'Test Results'
           url: "${TEST_JOB_URL}/artifacts/browse/${IVTEST_REL_PATH}"
         - name: 'Build Artifacts'
           url: "${BUILD_JOB_URL}/artifacts/browse/${IVINSTALL_REL_PATH}"

deploy-job:
  stage: deploy
  tags: [nas]
  rules:
    - if: $CI_COMMIT_TAG    
  script:
    # Verify NAS mountpoint
    - NAS="$HOME/nas"
    - mountpoint "$NAS"
    - QA_DIR="$HOME/nas/SoftwareQA/ivinstall/$CI_COMMIT_TAG"
    # Create deploy dir and deploy artifacts
    - mkdir -p "$QA_DIR"
    - BROWSE_URL="$CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG"
    - echo "<meta http-equiv='Refresh' content='0; url=$BROWSE_URL' />" > "$QA_DIR/${CI_COMMIT_TAG}.html"
    - cp -r out/* "$QA_DIR"


