CONFIG_SYS_VENDOR="iveia"
CONFIG_SYS_BOARD="atlas"
CONFIG_ENV_SOURCE_FILE="atlas"

CONFIG_MISC_INIT_R=y
# CONFIG_CMD_EEPROM is not set
CONFIG_BOOTCOMMAND="run iv_boot_sequencer"
CONFIG_OF_LIBFDT_OVERLAY=y
CONFIG_BOOTDELAY=0
CONFIG_CMD_SETEXPR=y
CONFIG_IDENT_STRING=""

# we use custom ivfru command - turn off Xilinx's FRU
CONFIG_CMD_FRU=n

# we use custom u-boot env - turn off u-boot distro default env
CONFIG_DISTRO_DEFAULTS=n

# Force saved env to be QSPI.  QSPI is 256MB, and env is at end.
CONFIG_ENV_IS_IN_FAT=n
CONFIG_ENV_IS_IN_NAND=n
CONFIG_ENV_IS_IN_SPI_FLASH=y
CONFIG_ENV_IS_NOWHERE=n
CONFIG_ENV_OFFSET=0x1E00000
CONFIG_ENV_OFFSET_REDUND=0x1E80000
